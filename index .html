<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muqdisho.U</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #141414;
      color: white;
    }header {
  padding: 20px;
  font-size: 24px;
  font-weight: bold;
  color: #e50914;
}

.container {
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

.card {
  background: #222;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
  background: #333;
}

.player {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

video {
  width: 90%;
  max-width: 900px;
  border-radius: 10px;
}

.close {
  margin-top: 10px;
  padding: 10px 20px;
  background: red;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 5px;
}

  </style>
</head>
<body><header>Muqdisho.U</header><div class="container">
  <h2>Casharo</h2>
  <div class="grid">
    <div class="card" onclick="playVideo()">
      🎬 Casharka 1
    </div>
  </div>
</div><div class="player" id="player">
  <video controls autoplay id="videoPlayer">
    <source src="https://gateway.pinata.cloud/ipfs/bafybeie2gc75yw43y7nmwk25bbrxkzj77chmof3hrnecn5zleddttku3cq" type="video/mp4">
  </video>
  <button class="close" onclick="closeVideo()">Close</button>
</div><script>
  function playVideo() {
    document.getElementById('player').style.display = 'flex';
  }

  function closeVideo() {
    document.getElementById('player').style.display = 'none';
  }
</script></body>
</html>
