<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muqdisho.U - Casharo Web3</title>
  
  <script>
    (function() {
      var currentHost = window.location.hostname;
      // Haddii qofku qoro maxaas.u isagoon haysan Web3 Browser, u weecid dhanka .limo
      if (currentHost === "maxaas.u") {
        window.location.replace("https://maxaas.u.limo");
      }
    })();
  </script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #141414;
      color: white;
      text-align: center;
    }
    header {
      padding: 30px;
      font-size: 32px;
      font-weight: bold;
      color: #e50914;
      border-bottom: 1px solid #333;
    }
    .container {
      padding: 40px 20px;
    }
    h2 {
      margin-bottom: 30px;
      font-size: 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background: #222;
      padding: 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .card:hover {
      transform: scale(1.05);
      background: #e50914;
      border-color: white;
    }
    .player {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 1000;
    }
    video {
      width: 90%;
      max-width: 850px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
    }
    .close {
      margin-top: 20px;
      padding: 12px 30px;
      background: white;
      border: none;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      transition: 0.2s;
    }
    .close:hover {
      background: #ccc;
    }
  </style>
</head>
<body>

<header>Muqdisho.U</header>

<div class="container">
  <h2>Casharo Video ah</h2>
  <div class="grid">
    <div class="card" onclick="playVideo('https://gateway.pinata.cloud/ipfs/bafybeie2gc75yw43y7nmwk25bbrxkzj77chmof3hrnecn5zleddttku3cq')">
      🎬 Casharka 1aad
    </div>
    
    </div>
</div>

<div class="player" id="player">
  <video controls id="videoPlayer">
    <source src="" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <button class="close" onclick="closeVideo()">XIR VIDEO-KA</button>
</div>

<script>
  var player = document.getElementById('player');
  var video = document.getElementById('videoPlayer');

  function playVideo(url) {
    video.src = url;
    player.style.display = 'flex';
    video.play();
  }

  function closeVideo() {
    video.pause();
    video.src = "";
    player.style.display = 'none';
  }

  // Haddii qofku taabto bannaanka video-ka, ha xirmo
  player.onclick = function(e) {
    if (e.target == player) {
      closeVideo();
    }
  }
</script>

</body>
</html>
